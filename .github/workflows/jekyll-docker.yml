name: Jekyll Docker CI for AI Trader Signal App

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]
  workflow_dispatch:

jobs:
  build-jekyll-site:
    runs-on: ubuntu-latest
    name: Build & Test Jekyll Site in Docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Jekyll site with Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/srv/jekyll \
            jekyll/jekyll:4.2.2 \
            jekyll build

      - name: Test generated site with html-proofer (link checker)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
            starefossen/html-proofer:latest \
            /srv/jekyll/_site --disable-external --assume-extension

      # Future expansion: Python AI checks
      - name: Set up Python for future AI signals (optional)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies (if present)
        if: exists('requirements.txt')
        run: |
          pip install -r requirements.txt

      - name: Run AI signal checks (placeholder)
        if: exists('ai_signal_check.py')
        run: |
          python ai_signal_check.py

      # Deployment step (customize as needed)
      # - name: Deploy to GitHub Pages or another host
      #   run: echo "Add deployment steps here"

    # Security best practices
    env:
      JEKYLL_ENV: production
      # Add secrets as needed (e.g., for deployments)
      # API_TOKEN: ${{ secrets.API_TOKEN }}

# Notes:
# - This workflow builds your Jekyll dashboard/documentation, checks for broken links, 
#   and is ready for Python-based AI signal analysis.
# - Extend the Python steps for your AI logic as your app grows.
# - Uncomment and customize the deploy step for GitHub Pages, Netlify, or any host.
# - Store all secrets in GitHub Actions secrets, never in code.
