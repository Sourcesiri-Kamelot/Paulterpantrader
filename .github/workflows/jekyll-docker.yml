name: Jekyll Docker CI for AI Trader Signal App

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]
  workflow_dispatch:

jobs:
  build-jekyll-site:
    runs-on: ubuntu-latest
    name: Build & Test Jekyll Site in Docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Jekyll site with Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/srv/jekyll \
            jekyll/jekyll:4.2.2 \
            jekyll build

      - name: Test generated site with html-proofer (link checker)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
            starefossen/html-proofer:latest \
            /srv/jekyll/_site --disable-external --assume-extension

      - name: Set up Python for AI signals (optional)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies (if present)
        if: exists('requirements.txt')
        run: |
          pip install -r requirements.txt

      - name: Run AI signal checks (placeholder)
        if: exists('ai_signal_check.py')
        run: |
          python ai_signal_check.py

    env:
      JEKYLL_ENV: production
